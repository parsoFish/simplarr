version: "2"
linters:
  default: standard
  enable: [errcheck, govet, staticcheck, unused, ineffassign, misspell, gocyclo]
  settings:
    gocyclo:
      min-complexity: 15
    errcheck:
      # Nothing useful can be done when writing CLI output fails or when
      # closing a response body that was already read.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.ReadCloser).Close
