name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

# Required environment variables for docker compose variable interpolation
env:
  PUID: "1000"
  PGID: "1000"
  TZ: "UTC"
  DOCKER_CONFIG: "/tmp/docker-config"
  DOCKER_MEDIA: "/tmp/docker-media"

jobs:
  lint:
    name: Lint (ShellCheck + PSScriptAnalyzer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck against all .sh files
        run: |
          # --severity=warning is the standard bar for CI: catches genuine
          # correctness issues (SC2034 unused vars, SC2068 word-splitting
          # bugs, etc.) without tripping on info-level false positives
          # common in test helpers — trap handlers flagged SC2317 as
          # "unreachable" and intentional single-quoted example strings
          # flagged SC2016.
          mapfile -t sh_files < <(find . -name "*.sh" -not -path "./.git/*" | sort)
          if [ "${#sh_files[@]}" -eq 0 ]; then
            echo "No .sh files found."
          else
            shellcheck --severity=warning "${sh_files[@]}"
          fi

      - name: Run PSScriptAnalyzer against all .ps1 files
        shell: pwsh
        run: |
          # Settings file pins severity + rule exclusions so CI and local
          # pwsh invocations agree. See .github/linters/PSScriptAnalyzerSettings.psd1.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = Join-Path $PWD '.github/linters/PSScriptAnalyzerSettings.psd1'
          $ps1Files = Get-ChildItem -Recurse -Filter "*.ps1" |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' }
          $findings = $ps1Files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings
          }
          if ($findings) {
            $findings | Format-List
            Write-Error "PSScriptAnalyzer found $($findings.Count) Warning/Error finding(s). Failing lint."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no Warning or Error findings."

  eslint-homepage:
    name: ESLint (Homepage JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint dependencies
        run: npm install --prefix homepage

      - name: Run ESLint on homepage JavaScript
        run: node homepage/node_modules/.bin/eslint homepage/js/

  go:
    name: Go (vet, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test ./... -race

      - name: Coverage gate (internal/... must stay at or above 80%)
        run: |
          go test ./internal/... -race -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "internal/... coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below the 80% gate"; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: app

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  app-image:
    name: App image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build the image
        run: docker build --build-arg VERSION=ci -t simplarr-app:ci app

      - name: Image runs as the non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' simplarr-app:ci)
          echo "image user: ${user}"
          test "${user}" = "65532:65532"

      - name: Smoke test the running container
        run: |
          docker run -d --name simplarr-ci -p 127.0.0.1:18080:8080 simplarr-app:ci
          trap 'docker logs simplarr-ci; docker rm -f simplarr-ci' EXIT
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' simplarr-ci)
            [ "${status}" = "healthy" ] && break
            sleep 1
          done
          test "${status}" = "healthy"
          curl -fsS --max-time 5 http://127.0.0.1:18080/healthz
          curl -fsS --max-time 5 http://127.0.0.1:18080/login | grep -q 'id="root"'
          curl -fsS --max-time 5 http://127.0.0.1:18080/api/v1/auth/state | grep -q '"setupRequired":true'
          docker logs simplarr-ci 2>&1 | grep -q 'First-run setup token'

      - name: Cross-build for arm64 (Raspberry Pi), no emulation needed
        run: docker buildx build --platform linux/arm64 --build-arg VERSION=ci app

  fast-gate:
    name: Fast Gate (target < 15 min)
    runs-on: ubuntu-latest
    needs: [lint, eslint-homepage]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose-unified.yml
        env:
          COMPOSE_FILE: docker-compose-unified.yml
        run: docker compose config --quiet

      - name: Validate docker-compose-nas.yml
        env:
          COMPOSE_FILE: docker-compose-nas.yml
        run: docker compose config --quiet

      - name: Validate docker-compose-pi.yml
        env:
          COMPOSE_FILE: docker-compose-pi.yml
        run: docker compose config --quiet

      - name: Check required file existence
        run: |
          required_files=(
            "setup.sh"
            "preflight.sh"
            "configure.sh"
            "setup.ps1"
            "preflight.ps1"
            "configure.ps1"
          )
          required_dirs=(
            "homepage"
            "nginx"
            "templates"
          )

          failed=0

          for f in "${required_files[@]}"; do
            if test -f "$f"; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f" >&2
              failed=1
            fi
          done

          for d in "${required_dirs[@]}"; do
            if test -d "$d"; then
              echo "  [OK] $d/"
            else
              echo "  [MISSING] $d/" >&2
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more required files/directories are missing." >&2
            exit 1
          fi

      - name: Bash shell script syntax check
        run: |
          failed=0
          while IFS= read -r script; do
            if bash -n "$script" 2>&1; then
              echo "  [OK] $script"
            else
              echo "  [FAIL] $script" >&2
              failed=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" | sort)

          if [ "$failed" -ne 0 ]; then
            echo "One or more shell scripts have syntax errors." >&2
            exit 1
          fi

      - name: PowerShell AST syntax validation
        shell: pwsh
        run: |
          # Use Language.Parser::ParseFile (the PowerShell 3+ AST parser)
          # rather than the legacy PSParser::Tokenize. The legacy tokenizer
          # dates from PS2 and emits false positives on PowerShell 5.1+
          # syntax that runs fine at runtime — see issues like param
          # attribute suppression, $using: variables in ScriptBlock,
          # ternary expressions, and similar.
          $failed = $false
          $scripts = Get-ChildItem -Recurse -Filter "*.ps1" |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' }

          foreach ($script in $scripts) {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors)

            if ($parseErrors.Count -gt 0) {
              Write-Host ""
              Write-Host "Syntax errors in $($script.FullName):"
              foreach ($err in $parseErrors) {
                Write-Host "  Line $($err.Extent.StartLineNumber), Col $($err.Extent.StartColumnNumber): $($err.Message)"
              }
              $failed = $true
            } else {
              Write-Host "  [OK] $($script.FullName)"
            }
          }

          if ($failed) {
            Write-Error "One or more PowerShell scripts have syntax errors."
            exit 1
          }

  full-suite:
    name: Full Suite (target < 30 min)
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Placeholder — full container tests (stub)
        run: |
          # TODO: Full container tests will be wired in a later work item.
          # This placeholder step ensures full-suite job structure is valid
          # and depends on fast-gate completing successfully.
          echo "Full container tests: stub placeholder — to be implemented in a later item."
